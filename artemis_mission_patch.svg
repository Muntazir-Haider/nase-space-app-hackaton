<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Space Gradient -->
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1736" />
      <stop offset="70%" stop-color="#050a18" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>

    <!-- Metallic Gold Outer Border -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Artemis Red/Orange Trajectory Chevron -->
    <linearGradient id="artemisChevron" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Moon Shading -->
    <radialGradient id="moonGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="45%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </radialGradient>
  </defs>

  <!-- Outer Ring with Gold Trim -->
  <circle cx="100" cy="100" r="96" fill="#0b3d91" stroke="url(#goldRing)" stroke-width="4" />
  <circle cx="100" cy="100" r="88" fill="url(#spaceGrad)" stroke="#1e3a8a" stroke-width="1.5" />

  <!-- Background Constellation Stars -->
  <circle cx="45" cy="65" r="1.2" fill="#ffffff" opacity="0.9" />
  <circle cx="70" cy="45" r="1.5" fill="#93c5fd" opacity="0.8" />
  <circle cx="140" cy="55" r="1.2" fill="#ffffff" opacity="0.85" />
  <circle cx="160" cy="80" r="1.4" fill="#fed7aa" opacity="0.9" />
  <circle cx="40" cy="125" r="1.2" fill="#ffffff" opacity="0.75" />
  <circle cx="155" cy="135" r="1.2" fill="#ffffff" opacity="0.8" />
  <circle cx="130" cy="155" r="1.5" fill="#93c5fd" opacity="0.9" />

  <!-- Lunar Sphere (South Pole Target) -->
  <circle cx="100" cy="68" r="28" fill="url(#moonGrad)" />
  <!-- Moon Craters -->
  <circle cx="94" cy="60" r="4.5" fill="#94a3b8" opacity="0.6" />
  <circle cx="108" cy="72" r="6" fill="#94a3b8" opacity="0.55" />
  <circle cx="92" cy="78" r="3.5" fill="#64748b" opacity="0.7" />
  <circle cx="112" cy="58" r="3" fill="#64748b" opacity="0.6" />
  <!-- Artemis Base Camp South Pole Marker -->
  <circle cx="100" cy="94" r="2.5" fill="#38bdf8" />
  <circle cx="100" cy="94" r="5" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.8" />

  <!-- Trajectory Arc from Earth to Moon -->
  <path d="M 38 152 Q 62 100, 98 94" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-dasharray="3 2" />

  <!-- Artemis Stylized "A" Chevron -->
  <path d="M 100 36 L 142 152 L 124 152 L 100 84 L 76 152 L 58 152 Z" fill="url(#artemisChevron)" filter="drop-shadow(0px 3px 6px rgba(0,0,0,0.6))" />
  
  <!-- Horizontal Horizon Crossbar of "A" (Earth Horizon Arc) -->
  <path d="M 66 122 Q 100 114, 134 122" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

  <!-- Top Ribbon Text: ARTEMIS -->
  <text x="100" y="174" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="13" font-weight="900" letter-spacing="2" text-anchor="middle">
    ARTEMIS III
  </text>
  <text x="100" y="186" fill="#93c5fd" font-family="monospace" font-size="8" font-weight="bold" letter-spacing="1" text-anchor="middle">
    NASA · LUNAR RECON
  </text>
</svg>
